- id: 312edd83
  name: '@cordisjs/plugin-timer'
- id: 0a9ec786
  name: '@cordisjs/plugin-http'
- id: 4cd8d0ee
  name: '@cordisjs/plugin-http-socks'
- id: mtproto01
  name: '@mtproto-relay/mtproto'
  config:
    port: 4430
    host: 0.0.0.0
    rsaKeyPath: ./data/rsa-key.json
    authKeyStorePath: ./data/auth-keys.json
- id: bridge01
  name: '@mtproto-relay/bridge'
  config:
    serverHost: 127.0.0.1
    groupFilesMiniApp:
      enabled: true
      path: /group-files
    serverPort: 4430
- id: merged-forward
  name: '@mtproto-relay/merged-forward'
- id: platform-admin-bot
  name: '@mtproto-relay/platform-admin-bot'
  config:
    allowedPlatformSessionIds: []
    crossAccountAccess: false
    showLoginCodes: true
    webuiUrl: ''
- id: telegram-bot-api
  name: '@mtproto-relay/telegram-bot-api'
  config:
    verifierSecret: dev-verifier-secret
- id: qq-flash-transfer-bot
  name: '@mtproto-relay/qq-flash-transfer-bot'
  config: {}
- id: telegram-resources
  name: '@mtproto-relay/telegram-resources'
  config: {}
- id: qqnt
  name: '@mtproto-relay/platform-qqnt'
  config:
    endpoint: http://qqnt-2:18767/v1
    token: !!js process.env.CROSSGRAM_QQNT_TOKEN
    grayTipFilters:
      - 回应了你的
- id: mtproto-debug
  name: '@mtproto-relay/mtproto-debug'
  config:
    maxEvents: 2000
    initiallyPaused: true
- id: mtproto-statistics
  name: '@mtproto-relay/mtproto-statistics'
  config:
    sampleIntervalMs: 1000
    slowThresholdMs: 1000
    historySeconds: 900
- id: history-backfill
  name: '@mtproto-relay/history-backfill'
  config:
    enabled: true
    idleAfterMs: 60000
    intervalMs: 3000
    pageSize: 50
    dailyRequestCap: 3000
    maxAgeDays: 180
- id: fa2b056a
  name: '@cordisjs/plugin-server'
  config:
    port: 3140
    maxWebSocketPayload: 4194304
- id: aa143c36
  name: '@cordisjs/plugin-server-acl'
- id: 8357f09b
  name: '@cordisjs/plugin-group'
  label: Database
  config:
    - id: 5b69b05e
      name: '@cordisjs/plugin-database'
    - id: 07c0d352
      name: '@cordisjs/plugin-database-sqlite'
      config:
        path: ./data/cordis.db
        journalMode: wal
        busyTimeout: 5000
- id: update-store-database
  name: '@mtproto-relay/update-store-database'
  config:
    retention: 10000
- id: debug-scripts
  name: '@mtproto-relay/debug-scripts'
  config:
    root: ./data/debug-scripts
    results: ./data/debug-results
    ttl: 1800000
- id: 7bf6f701
  name: '@cordisjs/plugin-group'
  label: SSO
  config:
    - id: ee017963
      name: '@cordisjs/plugin-sso'
    - id: 8d3a0f12
      name: '@cordisjs/plugin-sso-server'
    - id: 45bc2d91
      name: '@cordisjs/plugin-sso-password'
- id: 0c9db8e2
  name: '@cordisjs/plugin-group'
  label: WebUI
  config:
    - id: 4430a808
      name: cordis-webui-react
    - id: f64a9366
      name: '@cordisjs/plugin-database-webui'
    - id: 03ebc689
      name: '@cordisjs/plugin-http-webui'
    - id: 8a9b6184
      name: '@cordisjs/plugin-insight'
    - id: 7c7aff7a
      name: '@cordisjs/plugin-loader-webui'
    - id: 7adac547
      name: '@cordisjs/plugin-logger-webui'
    - id: afe4937f
      name: '@cordisjs/plugin-market'
    - id: 539bc93a
      name: '@cordisjs/plugin-notifier'
    - id: 126b4c42
      name: cordis-webui-react/server
    - id: f9c1a8b2
      name: '@cordisjs/plugin-webui-sso'
- id: 375b963c
  name: '@cordisjs/plugin-group'
  label: Development
  config:
    - id: e1e36558
      name: '@cordisjs/plugin-hmr'
      config:
        root:
          - src
          - app.dev.yml
- id: local-stickers
  name: ./src/local-stickers/index.ts
  config:
    root: ./data/local-stickers
